# Local infrastructure for development (SQL Server + RabbitMQ).
# Start:  docker compose up -d
# Stop:   docker compose down          (data is kept in volumes)
#
# RabbitMQ management UI: http://localhost:15672  (guest / guest)
# SQL Server:             localhost,1433           (sa / see MSSQL_SA_PASSWORD below)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # runs under Rosetta on Apple Silicon
    container_name: realestate-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-RealEstate_Dev_2026!}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: realestate-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  sqlserver-data:
  rabbitmq-data:
